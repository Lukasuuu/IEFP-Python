{% extends "base.html" %}
{% block content %}
<h2>Meteorologia</h2>
<form method="post">
  Cidade: <input type="text" name="cidade">
  <button type="submit">Buscar</button>
</form>

{% if dados %}
  <p>Cidade: {{ dados.get('name', 'N/A') }}</p>
  <p>Temperatura: {{ dados.get('main', {}).get('temp', 'N/A') }} °C</p>
  <p>Clima: {{ dados.get('weather', [{}])[0].get('description', 'N/A') }}</p>
{% endif %}
{% endblock %}
