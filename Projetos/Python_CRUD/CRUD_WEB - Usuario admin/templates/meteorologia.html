{% extends "base.html" %}
{% block content %}
<h2>Meteorologia</h2>
<form method="post">
  Cidade: <input type="text" name="cidade">
  <button type="submit">Buscar</button>
</form>

{% if dados %}
  <p>Temperatura: {{ dados.main.temp }} °C</p>
  <p>Clima: {{ dados.weather[0].description }}</p>
{% endif %}
{% endblock %}
