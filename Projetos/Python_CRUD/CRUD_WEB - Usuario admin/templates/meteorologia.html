{% extends "base.html" %}
{% block content %}
<div style="display: flex; justify-content: center; margin-bottom: 30px;">
  <div style="
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 20px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    background-color: #f9f9f9;
    width: 100%;
    max-width: 300px;
    text-align: center;
  ">
    <h2 style="font-size: 2em; color: #333; font-weight: 600; margin-bottom: 20px;">🌤️ Meteorologia</h2>

    <form method="post" style="display: flex; flex-direction: column; gap: 10px;">
      <input type="text" name="cidade" placeholder="Digite o nome da cidade"
             style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
      <button type="submit"
              style="padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
        🔍 Buscar
      </button>
    </form>

    {% if dados %}
      <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 12px;">
        <div style="text-align: left;">
          <strong>📍 Cidade:</strong><br>
          <span style="display: inline-block; background-color: #fff; padding: 6px 12px; border: 1px solid #ccc; border-radius: 4px;">
            {{ dados.get('name', 'N/A') }}
          </span>
        </div>
        <div style="text-align: left;">
          <strong>🌡️ Temperatura:</strong><br>
          <span style="display: inline-block; background-color: #fff; padding: 6px 12px; border: 1px solid #ccc; border-radius: 4px;">
            {{ dados.get('main', {}).get('temp', 'N/A') }} °C
          </span>
        </div>
        <div style="text-align: left;">
          <strong>☁️ Clima:</strong><br>
          <span style="display: inline-block; background-color: #fff; padding: 6px 12px; border: 1px solid #ccc; border-radius: 4px;">
            {{ dados.get('weather', [{}])[0].get('description', 'N/A') }}
          </span>
        </div>
      </div>
    {% endif %}
  </div>
</div>
{% endblock %}
