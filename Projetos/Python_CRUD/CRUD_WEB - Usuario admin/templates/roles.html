{% extends "base.html" %}
{% block content %}
<h2>Gerir Roles</h2>
<table border="1">
  <tr><th>ID</th><th>Username</th><th>Role</th><th>Ação</th></tr>
  {% for u in utilizadores %}
  <tr>
    <td>{{ u.id }}</td>
    <td>{{ u.username }}</td>
    <td>{{ u.role }}</td>
    <td>
      <form method="post">
        <input type="hidden" name="user_id" value="{{ u.id }}">
        <select name="role">
          <option value="user">user</option>
          <option value="admin">admin</option>
        </select>
        <button type="submit">Atualizar</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
