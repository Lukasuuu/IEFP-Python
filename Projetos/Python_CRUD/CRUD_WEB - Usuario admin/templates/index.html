{% extends "base.html" %}
{% block content %}
<!doctype html>
<html lang="pt">
  <h1><p align="center"><strong>IEFP Python Project 🐍</strong></p></h1>
  <table border="1" cellpadding="6" align="center">
    <tr>
      <th>ID</th><th>Nome</th><th>Email</th><th>Criado em</th><th>Ações</th>
    </tr>
    {% for u in utilizadores %}
    <tr>
      <td>{{ u.id }}</td>
      <td>{{ u.nome }}</td>
      <td>{{ u.email }}</td>
      <td>{{ u.created_at }}</td>
      <td>
        <a href="/editar/{{ u.id }}">Editar</a>
        <form action="/apagar/{{ u.id }}" method="post" style="display:inline;">
          <button type="submit">Apagar</button>
        </form>
      </td>
    </tr>
    {% endfor %}
    <p align="center"> <a href="{{ url_for('novo') }}">Novo Utilizador</p>
  </table>
</html>
{%endblock%}
