{% extends "base.html" %}
{% block content %}
<div style="display: flex; justify-content: center; margin-bottom: 30px;">
  <div style="
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 20px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    background-color: #f9f9f9;
    width: 100%;
    max-width: 300px;
    text-align: center;
  ">
    <h2 style="font-size: 2em; color: #333; font-weight: 600; margin-bottom: 20px;">Registrar</h2>

    <form method="post" style="display: flex; flex-direction: column; gap: 10px;">
      <input type="text" name="username" placeholder="Username" required
             style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">

      <input type="password" name="password" placeholder="Password" required
             style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">

      <button type="submit"
              style="padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
        Criar Conta
      </button>
    </form>
  </div>
</div>
{% endblock %}
