{% extends "base.html" %}

{% block title %}Criar Cliente{% endblock %}

{% block content %}

<h1 class="mb-4">Criar Cliente</h1>

<form method="POST">

    <input type="hidden" name="acao" value="salvar">

    <div class="mb-3">
        <label class="form-label">Nome</label>
        <input type="text" name="nome" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Telefone</label>
        <input type="text" name="telefone" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Morada</label>
        <input type="text" name="morada" class="form-control">
    </div>

    <button type="submit" class="btn btn-success mt-3">Criar Cliente</button>

</form>

<a href="{{ url_for('clientes_listar') }}" class="btn btn-outline-secondary mt-3">
    Voltar à lista
</a>

{% endblock %}
