{% extends "base.html" %}
{% block title %}Animals - Clinica Veterinaria{% endblock %}

{% block content %}
  <h1>Bem-vindo a Animals</h1>
  <p>Plataforma para gestão de clientes, animais e consultas.</p>

  <!-- Se o utilizador não estiver autenticado, mostra link de entrada -->
  {% if not session.get("user_id") %}
    <!-- Usamos a classe btn-sm-custom definida no base.html para manter o estilo consistente -->
    <p><a class="btn-sm-custom" href="{{ url_for('login') }}">Entrar</a></p>
  {% else %}

  {% endif %}
{% endblock %}
