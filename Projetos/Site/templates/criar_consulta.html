{% extends "base.html" %}

{% block title %}Criar Consulta{% endblock %}

{% block content %}

<h1 class="mb-4">Criar Consulta</h1>

<form method="POST">

    <input type="hidden" name="acao" value="salvar">

    <div class="mb-3">
        <label class="form-label">Animal</label>
        <select name="animal_id" class="form-control" required>
            <option value="">-- Selecione um animal --</option>

            {% for a in animais %}
                <option value="{{ a.id }}">
                    {{ a.nome }} ({{ a.cliente_nome }})
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Data e Hora</label>
        <input type="datetime-local" name="data_hora" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Motivo</label>
        <input type="text" name="motivo" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Notas</label>
        <textarea name="notas" class="form-control" rows="4"></textarea>
    </div>

    <button type="submit" class="btn btn-success mt-3">Criar Consulta</button>

</form>

<a href="{{ url_for('consultas_listar') }}" class="btn btn-outline-secondary mt-3">
    Voltar à lista
</a>

{% endblock %}
