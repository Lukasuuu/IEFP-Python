{% extends "base.html" %}
{% block title %}Criar Consulta{% endblock %}

{% block content %}
<h1>Criar Consulta</h1>

<div class="form-container">
<form method="POST">

    <label>Cliente:</label>
    <select name="cliente_id" class="form-control" onchange="this.form.submit()">
        <option value="">-- Selecionar Cliente --</option>
        {% for c in clientes %}
            <option value="{{ c.id }}"
                {% if request.form.cliente_id == c.id|string %}selected{% endif %}>
                {{ c.nome }}
            </option>
        {% endfor %}
    </select>

    <label>Animal:</label>
    <select name="animal_id" class="form-control" required>
        <option value="">-- Selecionar Animal --</option>
        {% for a in animais %}
            <option value="{{ a.id }}">{{ a.nome }}</option>
        {% endfor %}
    </select>

    <label>Data e Hora:</label>
    <input type="datetime-local" name="data_hora" class="form-control" required>

    <label>Motivo:</label>
    <input type="text" name="motivo" class="form-control" required>

    <label>Notas:</label>
    <textarea name="notas" class="form-control"></textarea>

    <button type="submit" class="btn-sm-custom mt-3">Criar Consulta</button>

</form>
</div>

{% endblock %}
