{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
  

  <form method="post">
    <h1>Login</h1>
    <p>
      Username<br>
      <input type="text" name="username" required>
    </p>

    <p>
      Password<br>
      <input type="password" name="password" required>
    </p>

    <button type="submit">Entrar</button>
  </form>
{% endblock %}
