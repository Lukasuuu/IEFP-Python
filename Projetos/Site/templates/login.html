<!doctype html>
<html lang="pt">
<head>
    <meta charset="utf-8">
    <title>Login - Animals</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>

<!-- 
    Página de login
    Usa Bootstrap + estilos.css
    Removemos estilos inline e usamos classes utilitárias
-->
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <!-- Cartão central do login -->
    <div class="card shadow p-4 login-card">

        <h2 class="text-center mb-3">Animals</h2>
        <h5 class="text-center text-muted mb-4">Login</h5>

        <!-- Mensagens flash -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert alert-danger py-2">
                    {% for msg in messages %}
                        <div>{{ msg }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <!-- Formulário de login -->
        <form method="post">

            <!-- Username -->
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <!-- Botão -->
            <button type="submit" class="btn btn-primary w-100">Entrar</button>

        </form>

    </div>

</body>
</html>
