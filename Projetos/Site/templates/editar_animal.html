{% extends "base.html" %}

{% block title %}Editar Animal{% endblock %}

{% block content %}

<h1 class="mb-4">Editar Animal</h1>

<form method="POST">

    <input type="hidden" name="acao" value="salvar">

    <div class="mb-3">
        <label class="form-label">Nome</label>
        <input type="text" name="nome" class="form-control"
               value="{{ animal.nome }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Espécie</label>
        <input type="text" name="especie" class="form-control"
               value="{{ animal.especie }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Raça</label>
        <input type="text" name="raca" class="form-control"
               value="{{ animal.raca }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Data de Nascimento</label>
        <input type="date" name="data_nascimento" class="form-control"
               value="{{ animal.data_nascimento }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Cliente</label>
        <select name="cliente_id" class="form-control" required>
            {% for c in clientes %}
                <option value="{{ c.id }}"
                    {% if animal.cliente_id == c.id %}selected{% endif %}>
                    {{ c.nome }}
                </option>
            {% endfor %}
        </select>
    </div>

    <button type="submit" class="btn btn-primary mt-3">Guardar Alterações</button>

</form>

<a href="{{ url_for('animais_listar') }}" class="btn btn-outline-secondary mt-3">
    Voltar à lista
</a>

{% endblock %}
