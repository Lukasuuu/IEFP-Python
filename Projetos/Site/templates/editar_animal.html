{% extends "base.html" %}
{% block title %}Editar Animal{% endblock %}

{% block content %}
<h1>Editar Animal</h1>

<div class="form-container">
<form method="POST">

    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" class="form-control" value="{{ animal.nome }}" required>

    <label for="especie">Espécie:</label>
    <input type="text" id="especie" name="especie" class="form-control" value="{{ animal.especie }}" required>

    <label for="raca">Raça:</label>
    <input type="text" id="raca" name="raca" class="form-control" value="{{ animal.raca }}">

    <label for="data_nascimento">Data de Nascimento:</label>
    <input type="date" id="data_nascimento" name="data_nascimento" class="form-control"
           value="{{ animal.data_nascimento if animal.data_nascimento else '' }}">

    {% if clientes %}
        <label for="cliente_id">Cliente:</label>
        <select id="cliente_id" name="cliente_id" class="form-control" required>
            <option value="">-- Selecione um cliente --</option>
            {% for c in clientes %}
                <option value="{{ c.id }}" {% if animal.cliente_id == c.id %}selected{% endif %}>
                    {{ c.nome }}
                </option>
            {% endfor %}
        </select>
    {% endif %}

    <button type="submit" class="btn-sm-custom mt-3">Salvar Alterações</button>

</form>
</div>

<br>
<a href="{{ url_for('animais_listar') }}" class="btn-sm-custom">Voltar à lista</a>

{% endblock %}
