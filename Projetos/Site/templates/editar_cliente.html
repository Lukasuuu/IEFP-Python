{% extends "base.html" %}

{% block title %}Editar Cliente{% endblock %}

{% block content %}

<h1 class="mb-4">Editar Cliente</h1>

<form method="POST">

    <input type="hidden" name="acao" value="salvar">

    <div class="mb-3">
        <label class="form-label">Nome</label>
        <input type="text" name="nome" class="form-control"
               value="{{ cliente.nome }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Telefone</label>
        <input type="text" name="telefone" class="form-control"
               value="{{ cliente.telefone }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control"
               value="{{ cliente.email }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Morada</label>
        <input type="text" name="morada" class="form-control"
               value="{{ cliente.morada }}">
    </div>

    <button type="submit" class="btn btn-primary mt-3">Guardar Alterações</button>

</form>

<a href="{{ url_for('clientes_listar') }}" class="btn btn-outline-secondary mt-3">
    Voltar à lista
</a>

{% endblock %}
