{% extends "base.html" %}
<!-- Extende o layout base para herdar cabeçalho/rodapé/estilos -->
{% block title %}Criar Animal{% endblock %}
<!-- Define o título da página que aparece no browser -->
{% block content %}
<!-- Início do bloco de conteúdo principal -->
<h2>Criar Animal</h2>
<!-- Título visível na página -->

<form method="POST">
<!-- Formulário que envia via POST para a mesma rota -->

<label>Nome do Animal:</label>
<!-- Rótulo para o campo nome do animal -->
<input type="text" name="nome" required>
<!-- Campo de texto para nome (obrigatório) -->

<label>Espécie:</label>
<!-- Rótulo para o campo espécie -->
<input type="text" name="especie" required>
<!-- Campo de texto para espécie (obrigatório) -->

<label>Raça:</label>
<!-- Rótulo para o campo raça -->
<input type="text" name="raca">
<!-- Campo de texto para raça (opcional) -->

<label>Data de Nascimento:</label>
<!-- Rótulo para o campo data de nascimento -->
<input type="date" name="data_nascimento">
<!-- Campo de data para nascimento (opcional) -->

{% if clientes is defined and clientes %}
<!-- Verifica se a variável 'clientes' foi passada pelo backend -->
<label>Cliente (dono):</label>
<!-- Rótulo para o select de clientes -->
<select name="cliente_id" required>
<!-- Select para escolher o cliente dono (obrigatório para admin/staff) -->
  <option value="">-- Selecionar --</option>
  <!-- Opção vazia inicial -->
  {% for c in clientes %}
  <!-- Loop para listar cada cliente disponível -->
  <option value="{{ c.id }}">{{ c.nome }}</option>
  <!-- Opção com id e nome do cliente -->
  {% endfor %}
  <!-- Fim do loop de clientes -->
</select>
<!-- Fecha o select -->
{% endif %}
<!-- Fim do bloco condicional que mostra clientes -->

<button type="submit">Criar Animal</button>
<!-- Botão que submete o formulário -->

</form>
<!-- Fecha o formulário -->

{% endblock %}
<!-- Fecha o bloco content -->
