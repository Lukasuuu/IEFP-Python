{% extends "base.html" %}

{% block title %}Criar Utilizador{% endblock %}

{% block content %}

<h1 class="mb-4">Criar Utilizador</h1>

<form method="POST">

    <input type="hidden" name="acao" value="salvar">

    <div class="mb-3">
        <label class="form-label">Username (email ou nome)</label>
        <input type="text" name="username" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Papel</label>
        <select name="role" class="form-control" required>
            <option value="admin">Administrador</option>
            <option value="staff">Staff</option>
            <option value="cliente">Cliente</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Cliente associado</label>
        <select name="cliente_id" class="form-control">
            <option value="">-- Sem cliente associado --</option>

            {% for c in clientes %}
                <option value="{{ c.id }}">{{ c.nome }}</option>
            {% endfor %}
        </select>
    </div>

    <button type="submit" class="btn btn-success mt-3">Criar Utilizador</button>

</form>

<a href="{{ url_for('users_listar') }}" class="btn btn-outline-secondary mt-3">
    Voltar à lista
</a>

{% endblock %}
