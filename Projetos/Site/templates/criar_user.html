{% extends "base.html" %}
<!-- Extende o layout base para herdar cabeçalho/rodapé/estilos -->
{% block title %}Criar Utilizador{% endblock %}
<!-- Define o título da página que aparece no browser -->
{% block content %}
<!-- Início do bloco de conteúdo principal -->
<h2>Criar Utilizador</h2>
<!-- Título visível na página -->

<form method="POST">
<!-- Formulário que envia via POST para a mesma rota -->

<label>Username:</label>
<!-- Rótulo para o campo username -->
<input type="text" name="username" required>
<!-- Campo de texto para username (obrigatório) -->

<label>Password:</label>
<!-- Rótulo para o campo password -->
<input type="password" name="password" required>
<!-- Campo de password (obrigatório) -->

<label>Role:</label>
<!-- Rótulo para o campo role -->
<select name="role" required>
<!-- Select para escolher o papel do utilizador -->
  <option value="admin">admin</option>
  <!-- Opção admin -->
  <option value="staff">staff</option>
  <!-- Opção staff -->
  <option value="cliente">cliente</option>
  <!-- Opção cliente -->
</select>
<!-- Fecha o select do role -->

<label>Nome (opcional):</label>
<!-- Rótulo para o nome (opcional) -->
<input type="text" name="nome">
<!-- Campo de texto para nome -->

<label>Email (opcional):</label>
<!-- Rótulo para o email (opcional) -->
<input type="email" name="email">
<!-- Campo de email para contacto -->

<button type="submit">Criar Utilizador</button>
<!-- Botão que submete o formulário -->

</form>
<!-- Fecha o formulário -->

{% endblock %}
<!-- Fecha o bloco content -->
