{% extends "base.html" %}
{% block title %}Lista de Users{% endblock %}

{% block content %}

<!-- Título da página -->
<h1>Lista de Users</h1>

<!-- Tabela que mostra todos os users -->
<table border="1" cellpadding="5">

  <!-- Cabeçalho da tabela -->
  <tr>
    <th>ID</th>            <!-- ID do user -->
    <th>Username</th>      <!-- Nome de login -->
    <th>Role</th>          <!-- admin / staff / cliente -->
    <th>Criado em</th>     <!-- Data de criação -->
    <th>Ações</th>         <!-- Editar / Apagar -->
  </tr>

  <!-- Loop que percorre todos os users enviados pela rota -->
  {% for user in users %}
  <tr>

    <!-- Dados do user -->
    <td>{{ user.id }}</td>
    <td>{{ user.username }}</td>
    <td>{{ user.role }}</td>
    <td>{{ user.created_at }}</td>

    <!-- Ações disponíveis apenas para administradores -->
    <td>
      <a href="{{ url_for('editar_user', id=user.id) }}">Editar</a>
      <a href="{{ url_for('apagar_user', id=user.id) }}">Apagar</a>
    </td>

  </tr>
  {% endfor %}
</table>

{% endblock %}
