{% extends "base.html" %}

{% block title %}Editar Consulta{% endblock %}

{% block content %}

<h1 class="mb-4">Editar Consulta</h1>

<form method="POST">

    <input type="hidden" name="acao" value="salvar">

    <div class="mb-3">
        <label class="form-label">Animal</label>
        <select name="animal_id" class="form-control" required>
            {% for a in animais %}
                <option value="{{ a.id }}"
                    {% if consulta.animal_id == a.id %}selected{% endif %}>
                    {{ a.nome }} ({{ a.cliente_nome }})
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Data e Hora</label>
        <input type="datetime-local" name="data_hora" class="form-control"
               value="{{ consulta.data_hora|replace(' ', 'T') }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Motivo</label>
        <input type="text" name="motivo" class="form-control"
               value="{{ consulta.motivo }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Notas</label>
        <textarea name="notas" class="form-control" rows="4">{{ consulta.notas }}</textarea>
    </div>

    <button type="submit" class="btn btn-primary mt-3">Guardar Alterações</button>

</form>

<a href="{{ url_for('consultas_listar') }}" class="btn btn-outline-secondary mt-3">
    Voltar à lista
</a>

{% endblock %}
